trigger:
  branches:
    include: ['master', 'feat-*']
  paths:
    exclude: [CHANGELOG.md]
    
pr: none
variables:
- group: global-ci
stages:
 - stage: Build
   displayName: Build
   jobs:
    - job: Build
      displayName: Build Job
      pool:
        vmImage: 'ubuntu-22.04'
      steps:
        - checkout: self
          clean: true
          persistCredentials: true

        - task: UseDotNet@2
          displayName: 'Use .NET 10 Core sdk'
          enabled: true
          inputs:
            packageType: sdk
            version: 10.0.x
            installationPath: $(Agent.ToolsDirectory)/dotnet

        - task: DotNetCoreCLI@2
          name: publish_api
          inputs:
            command: publish
            publishWebProjects: false
            projects: 'src/One.Inception.Monitor/*.csproj'
            arguments: '/p:Configuration=Release --output $(Build.ArtifactStagingDirectory)/api'
            zipAfterPublish: false
            modifyOutputPath: false

        - task: Bash@3
          name: Release
          env:
            STAGING_PATH: $(Build.ArtifactStagingDirectory)
            LOCAL_PATH: $(Build.Repository.LocalPath)
            DOCKER_HUB_PASSWORD: $(DOCKER_HUB_PASSWORD)
            DOCKER_HUB_USER: $(DOCKER_HUB_USER)
          inputs:
            targetType: inline
            script: |
              npm install -g semantic-release@22.0.12 @semantic-release/exec@latest @semantic-release/changelog@latest @semantic-release/git@latest
              RELEASE_OUTPUT=$(npx semantic-release --no-ci)
              echo "$RELEASE_OUTPUT"
              if [[ "$RELEASE_OUTPUT" == *"Published"* ]]; then
                echo "##vso[task.setvariable variable=Released;isOutput=true]true"
              else
                echo  "##vso[task.setvariable variable=Released;isOutput=true]false"
              fi
              
   